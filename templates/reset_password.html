<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Reset Password - LeaveHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body style="background:#f5f7fa;display:flex;align-items:center;justify-content:center;min-height:100vh;">
    <div style="width:420px;background:white;padding:28px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,0.08);">
        <h3>Reset Password</h3>
        <p class="text-muted">Set a new password for your account.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ 'danger' if category == 'error' else 'success' }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('reset_password', token=token) }}">
            <div class="mb-3">
                <label for="password" class="form-label">New password</label>
                <input id="password" name="password" type="password" class="form-control" required>
            </div>
            <div class="mb-3">
                <label for="confirm_password" class="form-label">Confirm password</label>
                <input id="confirm_password" name="confirm_password" type="password" class="form-control" required>
            </div>
            <button class="btn btn-primary">Set password</button>
        </form>

        <div class="mt-3"><a href="{{ url_for('login') }}">Back to login</a></div>
    </div>
</body>
</html>
